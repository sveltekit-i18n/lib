packages:
  - 'examples/*'
  - 'site'
  # Branch-only: base master, packed, until it is released. Removed before merge.
  - 'vendor/base'

# The examples pin the published version so a copied-out directory installs on
# its own; inside the repository that range resolves to the workspace package.
linkWorkspacePackages: true

overrides:
  esbuild: ^0.28.2
  minimatch: ^10.2.6
