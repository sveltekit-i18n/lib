name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker covers the whole family — `sveltekit-i18n`, `@sveltekit-i18n/base`, the parsers and the extensions.

        Syntax questions about the **Curly Message Format** itself belong at [curlymessage.dev](https://curlymessage.dev), not here.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package does the bug appear in?
      options:
        - "sveltekit-i18n"
        - "@sveltekit-i18n/base"
        - "@sveltekit-i18n/parser-curly"
        - "@sveltekit-i18n/parser-icu"
        - "@sveltekit-i18n/extension-stores"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: The version of the package you selected above.
      placeholder: "3.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Steps to reproduce, or a link to a minimal reproduction. The [examples](https://sveltekit-i18n.github.io/examples) each open in StackBlitz — forking the closest one is usually the fastest way to show the problem.
      placeholder: |
        1. Configure the instance with...
        2. Navigate to...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: What actually happened?
    validations:
      required: true

  - type: input
    id: svelte-version
    attributes:
      label: Svelte version
      description: v3 needs Svelte 5 — the core is built on runes.
      placeholder: "5.56.9"
    validations:
      required: true

  - type: input
    id: sveltekit-version
    attributes:
      label: SvelteKit version
      description: Leave empty if you are not using SvelteKit.
      placeholder: "2.70.3"

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Where does the code run? v3 targets Node 22+, Bun 1.2+ and Deno 2+.
      options:
        - "Node.js"
        - "Bun"
        - "Deno"
        - "Browser only"
        - "Other (specify in additional context)"
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: "22.14.0"
    validations:
      required: true

  - type: dropdown
    id: adapter
    attributes:
      label: SvelteKit adapter
      description: Which adapter are you using?
      options:
        - "Not applicable"
        - "@sveltejs/adapter-auto"
        - "@sveltejs/adapter-node"
        - "@sveltejs/adapter-static"
        - "@sveltejs/adapter-vercel"
        - "@sveltejs/adapter-netlify"
        - "@sveltejs/adapter-cloudflare"
        - "Other (specify in additional context)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error logs
      description: Any relevant error messages or console output. Setting `config.log.level` to `'debug'` makes the instance report what it loads and why.
      render: shell
      placeholder: Paste error logs here

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — browser, operating system, bundler, a link to your repository.
      placeholder: Any additional information that might help

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am on v3 — or the bug is a critical one on the frozen 2.x line
          required: true
        - label: I have provided a minimal reproduction (if possible)
          required: false
        - label: I have checked the [Troubleshooting Guide](https://sveltekit-i18n.github.io/docs/troubleshooting)
          required: false
