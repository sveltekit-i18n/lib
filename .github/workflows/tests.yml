name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened,reopened,synchronize]
  push:
    branches:
      - master

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The two maintained LTS lines; engines declares >=22.
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - run: pnpm run test
        env:
          tests: true
