name: Examples

on:
  workflow_dispatch:
  pull_request:
    types: [opened,reopened,synchronize]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - '.github/workflows/examples.yml'
  push:
    branches:
      - master
    paths:
      - 'examples/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.config.js'
      - '.github/workflows/examples.yml'

jobs:
  Examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      # `eslint` rather than the package's `lint`, which fixes in place: a job
      # that rewrites files and passes proves nothing.
      - name: Lint Examples
        run: pnpm exec eslint examples

      # The examples import the package through its exports map, which points
      # at `dist/`; without a fresh build they would build against a stale one.
      - name: Build Package
        run: pnpm run build

      - name: Build Examples
        run: pnpm --filter './examples/*' run build

      # After the build, which is what writes the schemas the check reads.
      # Without a registration the check would pass on plain string keys, so
      # each one's presence is checked first.
      - name: Type-Check Examples
        run: |
          for schema in examples/*/src/i18n-schema.d.ts; do
            grep -q 'interface Register' "$schema" || { echo "no registration in $schema"; exit 1; }
          done
          test "$(ls examples/*/src/i18n-schema.d.ts | wc -l)" -eq "$(ls examples/*/package.json | wc -l)"
          pnpm --filter './examples/*' run check

      # An exit code proves nothing here: a page that renders without its
      # translations still builds. Assert on what was written, in more than one
      # locale.
      - name: Check Prerendered Output
        run: |
          grep -q 'The language is part of the address' examples/locale-router/build/prerendered/en.html
          grep -q 'Jazyk je součástí adresy' examples/locale-router/build/prerendered/cs.html
          grep -q 'Die Sprache gehört zur Adresse' examples/locale-router/build/prerendered/de.html
          grep -q 'Every page is a file on disk' examples/locale-router-static/build/en.html
          grep -q 'Každá stránka je soubor na disku' examples/locale-router-static/build/cs.html
          test -f examples/locale-router-advanced/build/404.html
          grep -q 'in English' examples/locale-router-advanced/build/about.html
          grep -q 'dva tvary adresy' examples/locale-router-advanced/build/cs/about.html
          grep -q 'Install the package' examples/mdsvex/build/en/guide.html
          grep -q 'Nainstaluj balíček' examples/mdsvex/build/cs/guide.html

      # The server-rendered examples write no HTML at build time, so they are
      # started and asked.
      - name: Check Server-Rendered Output
        run: |
          check() {
            PORT=4173 node "examples/$1/build/index.js" &
            local pid=$!
            for _ in $(seq 1 40); do
              curl -sf -o /dev/null http://127.0.0.1:4173/ && break
              sleep 0.25
            done
            local body
            # Without the hydration markers Svelte puts around blocks and
            # components, so the markup a component renders reads as written.
            body=$(curl -sf -H "Accept-Language: $2" "http://127.0.0.1:4173$3" | sed 's/<!--[^>]*-->//g')
            kill "$pid"
            local where="$1$3 ($2)"
            shift 3
            for expected in "$@"; do
              echo "$body" | grep -q "$expected" || { echo "missing '$expected' in $where"; exit 1; }
            done
          }
          check multi-page en / 'Translations that arrive with the route'
          check multi-page cs / 'Překlady, které dorazí s routou'
          check multi-page de /about 'Diese Seite hat ihren eigenen Namensraum'
          check multi-page ar / 'ترجمات تصل مع المسار' '<html lang="ar" dir="rtl">'
          check locale-param en '/?lang=cs' 'Jazyk je parametr v query'
          check component-scoped-csr en / 'A component with its own lexicon'
          # The rendered plural, not the title: the serialized payload carries
          # the title even when the block renders nothing.
          check component-scoped-ssr en / '4 days'
          check component-scoped-ssr cs / '4 dny'
          # Interpolated, and `$l` reading the fallback locale: the payload
          # carries only the messages.
          check stores cs / 'Máš 2 nepřečtené zprávy.' 'You have 2 unread messages.'
          check stores de / 'Du hast 2 ungelesene Nachrichten.'
          # The member form's line: the string form renders the same text in
          # an `<em>`.
          check typed-access cs / '<p>Máš 2 nepřečtené zprávy.</p>'
          check typed-access de / '<p>Du hast 2 ungelesene Nachrichten.</p>'
          # The serialized payload escapes `<`, so a tag found here was rendered.
          # The warnings in the log are the reports the page exists to show.
          check html en / '<ul><li>' 'This <a>link</a> has no address, and the image' 'target="_blank" rel="noopener noreferrer"'
          check html cs / 'Ahoj <b>&lt;b>Ann&lt;/b></b>, vítej zpět.'
