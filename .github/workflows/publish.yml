name: NPM Publish

on:
  workflow_dispatch:
    inputs:
        version:
          description: 'Version'
          required: true
          default: 'patch'
          type: choice
          options:
            - patch
            - minor
            - major
            - prerelease
        preid:
          description: 'Prerelease identifier (used by the prerelease bump)'
          required: false
          default: 'next'
          type: string
        tag:
          description: 'npm dist-tag to publish under'
          required: false
          default: 'latest'
          type: string

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish-npm:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Update version
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          pnpm version ${{ inputs.version }} --preid=${{ inputs.preid }}

      - name: Push changes
        run: git push --follow-tags

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        run: pnpm publish --tag ${{ inputs.tag }}
