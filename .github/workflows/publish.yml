name: NPM Publish

on:
  workflow_dispatch:
    inputs:
        version:
          description: 'Version'
          required: true
          default: 'patch'
          type: choice
          options:
            - patch
            - minor
            - major
            - prerelease
        preid:
          description: 'Prerelease identifier (used by the prerelease bump)'
          required: false
          default: 'next'
          type: string
        tag:
          description: 'npm dist-tag to publish under'
          required: false
          default: 'latest'
          type: string

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish-npm:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The release commit lands on a protected branch; the app is on the
      # bypass allowlist, GITHUB_TOKEN is not.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with a
      # Node release is not guaranteed to be one.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Update version
        id: bump
        run: |
          git config --local user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --local user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          echo "tag=$(pnpm version ${{ inputs.version }} --preid=${{ inputs.preid }} | tail -n 1)" >> "$GITHUB_OUTPUT"

      # Atomic: the branch and the tag land together or not at all, and the
      # publish below never runs on a half-pushed release.
      - name: Push release commit and tag
        run: git push --atomic origin HEAD:${{ github.ref_name }} '${{ steps.bump.outputs.tag }}'

      # No token: the registry authenticates the workflow itself over OIDC and
      # attaches provenance in the same step. The upload goes through npm even
      # though the install goes through pnpm -- npm is the client the registry
      # documents for trusted publishing, and this package declares no
      # `workspace:` dependency for pnpm to rewrite.
      - name: Publish package
        run: npm publish --tag ${{ inputs.tag }}

      # Last: publishing is irreversible, so a release must never announce a
      # version that failed to reach the registry.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          case "$TAG" in
            *-*) PRERELEASE=--prerelease ;;
            *)   PRERELEASE= ;;
          esac
          gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE
